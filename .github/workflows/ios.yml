name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project Fofac.xcodeproj -scheme Fofac -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Fofac.app Payload/
          zip -r fofac.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: fofac-ipa
          path: fofac.ipa
